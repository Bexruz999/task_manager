services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: task_manager_app
    command: >
      sh -c "echo 'Waiting for database...' &&
             sleep 5 &&
             php artisan migrate --force &&
             php-fpm"
      depends_on:
      - db
    volumes:
      - .:/var/www/html
    networks:
      - task_network
  nginx:
    image: nginx:alpine
    container_name: task_manager_nginx
    ports:
      - "8000:80"
    volumes:
      - .:/var/www/html
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app
    networks:
      - task_network

  db:
    image: postgres:16-alpine
    container_name: task_manager_db
    environment:
      POSTGRES_DB: task_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: root
    ports:
      - "5435:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - task_network

  dragonfly:
    image: 'docker.dragonflydb.io/dragonflydb/dragonfly'
    container_name: task_manager_dragonfly
    ports:
      - "6380:6379"
    ulimits:
      memlock: -1
    networks:
      - task_network

  mailpit:
    image: axllent/mailpit
    container_name: task_manager_mailpit
    ports:
      - "8025:8025"
      - "1025:1025"
    networks:
      - task_network

  horizon:
    build: .
    container_name: task_horizon
    volumes:
      - .:/var/www/html
    command: php artisan horizon
    depends_on:
      - app
      - dragonfly
    networks:
      - task_network


  scheduler:
    build: .
    container_name: task_scheduler
    volumes:
      - .:/var/www/html
    command: php artisan schedule:work
    depends_on:
      - app
    networks:
      - task_network

networks:
  task_network:
    driver: bridge

volumes:
  postgres_data:
